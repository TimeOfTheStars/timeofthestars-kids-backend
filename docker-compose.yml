services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
<<<<<<<>>>>>>> 2c014f2 (change compose file)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VK_TOKEN: ${VK_TOKEN}
      VK_READ_TOKEN: ${VK_READ_TOKEN:-}
      VK_REVIEWS_GROUP_ID: ${VK_REVIEWS_GROUP_ID:-125696800}
      VK_REVIEWS_TOPIC_ID: ${VK_REVIEWS_TOPIC_ID:-56616420}
      VK_SYNC_INTERVAL_MINUTES: ${VK_SYNC_INTERVAL_MINUTES:-15}
      VK_SYNC_INITIAL_DELAY_SECONDS: ${VK_SYNC_INITIAL_DELAY_SECONDS:-30}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static/teams:/app/static/teams
      - ./static/team-photos:/app/static/team-photos
    command: >
      sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
